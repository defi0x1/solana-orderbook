[package]
name = "clob-client"
version = "0.0.1"
edition = "2021"
description = "Rust client for the clob Solana program"
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
borsh = "0.10"
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2.0"
solana-account-info = "2.2"
solana-cpi = "2.2"
solana-instruction = "2.2"
solana-program-error = "2.2"
solana-pubkey = { version = "2.2", features = ["borsh"] }
